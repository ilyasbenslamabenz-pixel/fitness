name: EVO Fit Coach audit

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JavaScript and HTML parse
        shell: bash
        run: |
          npx --yes prettier@3.6.2 index.html --parser html >/dev/null
          node --check sw.js
