name: EVO Fit Coach audit

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JavaScript and HTML parse
        shell: bash
        run: |
          npx --yes prettier@3.6.2 index.html --parser html >/dev/null
          node --check sw.js
      - name: HTML and event audit
        shell: python
        run: |
          import html.parser, re, sys
          html=open("index.html",encoding="utf-8").read()
          class P(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids=[]
                  self.acts=[]
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  if "id" in d:
                      self.ids.append(d["id"])
                  if "data-act" in d:
                      self.acts.append(d["data-act"])
          p=P(); p.feed(html)
          dup=sorted({x for x in p.ids if p.ids.count(x)>1})
          cases=set(re.findall(r'case\s+"([^"]+)":',html))
          acts=set(p.acts)
          missing=sorted(acts-cases)
          refs=set(re.findall(r'\$\("([^"]+)"\)',html))
          dynamic_ids={"finishBar"}
          missing_refs=sorted(x for x in refs if x not in set(p.ids) and x not in dynamic_ids)
          if dup:
              print("Duplicate IDs:",dup)
              sys.exit(1)
          if missing:
              print("data-act without switch case:",missing)
              sys.exit(1)
          if missing_refs:
              print("DOM references without IDs:",missing_refs)
              sys.exit(1)
          print(f"Audit OK: {len(p.ids)} IDs, {len(acts)} actions, {len(cases)} switch cases")
